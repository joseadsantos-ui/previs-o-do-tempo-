  <main class="container">
    <h1>Consulta do Clima</h1>
    <div class="busca">
    <label for="cidade">Digite uma cidade:</label>
    <input
      type="text"
      id="cidade"
      placeholder="Ex.: Lages"
      autocomplete="off"
    >
    <button id="buscar">
      Buscar clima
    </button>
    </div>

    <section id="resultado" role="status" aria-live="polite">
      <!-- O JavaScript colocará o resultado aqui -->
    </section>

    <!-- Melhoria: últimas cidades pesquisadas -->
    <section id="historico" hidden>
      <h2 class="titulo-historico">Últimas buscas</h2>
      <div id="listaHistorico" class="lista-historico"></div>
    </section>
  </main>

  <script src="script.js"></script>
